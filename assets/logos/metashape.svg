<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A9F"/>
      <stop offset="100%" stop-color="#1A4A7A"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10" fill="url(#metaGrad)"/>
  <!-- 3D point cloud / mesh representation -->
  <circle cx="24" cy="16" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="14" cy="26" r="2.5" fill="white" opacity="0.75"/>
  <circle cx="34" cy="26" r="2.5" fill="white" opacity="0.75"/>
  <circle cx="20" cy="34" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="28" cy="34" r="2.5" fill="white" opacity="0.6"/>
  <!-- Mesh edges -->
  <line x1="24" y1="16" x2="14" y2="26" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="16" x2="34" y2="26" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="14" y1="26" x2="20" y2="34" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="34" y1="26" x2="28" y2="34" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="14" y1="26" x2="34" y2="26" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="34" x2="28" y2="34" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="14" y1="26" x2="28" y2="34" stroke="white" stroke-width="1" opacity="0.2"/>
  <line x1="34" y1="26" x2="20" y2="34" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>
